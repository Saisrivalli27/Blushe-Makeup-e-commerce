<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile | BLUSHÉ</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/navbar.css">
  <link rel="stylesheet" href="css/account.css">
</head>
<body>
  
  <main class="container layout-account">
    <!-- Sidebar -->
    <aside class="account-sidebar">
      <h3>My Account</h3>
      <ul class="account-nav">
        <li><a href="account.html" class="active">Profile</a></li>
        <li><a href="orders.html">Orders</a></li>
        <li><a href="wishlist.html">Wishlist</a></li>
        <li><a href="#" id="sidebar-logout">Sign Out</a></li>
      </ul>
    </aside>

    <!-- Content -->
    <div class="account-content">
      <h2>Profile Details</h2>
      <div class="profile-info-box">
        <div class="profile-avatar" id="profile-avatar">A</div>
        <div class="profile-text">
          <h3 id="profile-name">Loading...</h3>
          <p id="profile-email">loading@example.com</p>
        </div>
      </div>

      <h3 style="margin-top: var(--space-xl); margin-bottom: var(--space-md);">Saved Addresses</h3>
      <div class="address-box">
        <h4>Default Address</h4>
        <p>123 Beauty Lane, Apt 4<br>Mumbai, Maharashtra 400001<br>India</p>
        <button class="btn btn-outline" style="margin-top: var(--space-sm);">Edit</button>
      </div>
    </div>
  </main>

  <script type="module" src="js/main.js?v=2"></script>
  <script type="module" src="js/account.js?v=2"></script>
</body>
</html>
