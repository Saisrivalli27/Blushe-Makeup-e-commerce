<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | BLUSHÉ</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/navbar.css">
  <link rel="stylesheet" href="css/account.css">
</head>
<body>
  
  <main class="auth-page flex justify-center items-center">
    <div class="auth-card">
      <h1 class="text-center">Create Account</h1>
      <p class="text-center text-muted" style="margin-bottom: var(--space-xl);">Join the Inner Circle for exclusive access.</p>
      
      <form id="register-form">
        <div class="grid grid-cols-2 gap-sm" style="margin-bottom: var(--space-md);">
          <div class="form-group mb-0">
            <label class="form-label">First Name</label>
            <input type="text" id="reg-fname" class="form-control" required>
          </div>
          <div class="form-group mb-0">
            <label class="form-label">Last Name</label>
            <input type="text" id="reg-lname" class="form-control" required>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" id="reg-email" class="form-control" required>
        </div>
        <div class="form-group" style="margin-bottom: var(--space-lg);">
          <label class="form-label">Password</label>
          <input type="password" id="reg-password" class="form-control" required minlength="6">
        </div>
        
        <button type="submit" class="btn btn-primary btn-block">Register</button>
      </form>
      
      <div class="text-center" style="margin-top: var(--space-xl);">
        <p style="color: var(--color-text-muted); font-size: 0.9rem;">Already have an account? <a href="login.html" style="color: var(--color-text-main); font-weight: 500;">Sign in</a></p>
      </div>
    </div>
  </main>

  <script type="module" src="js/main.js?v=2"></script>
  <script type="module" src="js/account.js?v=2"></script>
</body>
</html>
