<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wishlist | BLUSHÉ</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/navbar.css">
  <link rel="stylesheet" href="css/products.css"> <!-- Reuse product grid styles -->
</head>
<body>
  
  <main class="container" style="padding-bottom: var(--space-xxl);">
    <h1 class="text-center" style="margin: var(--space-xl) 0;">Your Wishlist</h1>

    <!-- Wishlist Grid -->
    <div class="grid grid-cols-5 gap-lg" id="wishlist-grid" style="row-gap: var(--space-xl);">
      <!-- Rendered via JS -->
    </div>

    <!-- Empty State -->
    <div class="empty-state text-center" id="wishlist-empty-state" style="display: none; padding: var(--space-xxl) 0;">
      <h2>Your wishlist is empty</h2>
      <p style="color: var(--color-text-muted); margin-bottom: var(--space-lg);">Save your favorite items to view them later.</p>
      <a href="products.html" class="btn btn-primary">Discover Favorites</a>
    </div>

  </main>

  <script type="module" src="js/main.js?v=2"></script>
  <script type="module" src="js/wishlist.js?v=2"></script>
</body>
</html>
