<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | BLUSHÉ</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/navbar.css">
  <link rel="stylesheet" href="css/account.css">
</head>
<body>
  
  <main class="auth-page flex justify-center items-center">
    <div class="auth-card">
      <h1 class="text-center">Sign In</h1>
      <p class="text-center text-muted" style="margin-bottom: var(--space-xl);">Welcome back to your beauty rituals.</p>
      
      <form id="login-form">
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" id="login-email" class="form-control" required>
        </div>
        <div class="form-group" style="margin-bottom: var(--space-xl);">
          <div class="flex justify-between items-center">
            <label class="form-label" style="margin:0;">Password</label>
            <a href="#" style="font-size: 0.8rem; color: var(--color-text-muted); text-decoration: underline;">Forgot password?</a>
          </div>
          <input type="password" id="login-password" class="form-control" required>
        </div>
        
        <button type="submit" class="btn btn-primary btn-block">Sign In</button>
      </form>
      
      <div class="text-center" style="margin-top: var(--space-xl);">
        <p style="color: var(--color-text-muted); font-size: 0.9rem;">Don't have an account? <a href="register.html" style="color: var(--color-text-main); font-weight: 500;">Create one</a></p>
      </div>
    </div>
  </main>

  <script type="module" src="js/main.js"></script>
  <script type="module" src="js/account.js"></script>
</body>
</html>
